<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZerxsBot - Login Pairing</title>
  <link rel="stylesheet" href="/public/style.css" />
</head>
<body>
  <div class="login-center">
    <div class="card login-card">
      <!-- ikon web -->
      <div class="web-icon">🤖</div>
      <!-- judul web -->
      <h1>ZerxsBot Pairing Panel</h1>
      <!-- paragraf singkat tentang bot -->
      <p class="desc">
        ZerxsBot adalah bot WhatsApp berbasis Node.js &amp; Baileys dengan sistem pairing
        melalui website. Masuk menggunakan akun yang sudah didaftarkan admin pada
        Google Spreadsheet untuk mengakses panel pairing dan daftar fitur bot.
      </p>

      <form id="loginForm" autocomplete="off">
        <!-- input username -->
        <div class="field">
          <label for="username">USERNAME</label>
          <div class="input-shell">
            <input type="text" id="username" name="username" placeholder="Masukkan username" required />
          </div>
        </div>

        <!-- input nomor hp + kode negara (default +62 Indonesia) -->
        <div class="field">
          <label for="nomor">NOMOR TELEPON</label>
          <div class="phone-row">
            <select class="country" id="dialCode" title="Kode negara">
              <option value="62" selected>🇮🇩 +62</option>
              <option value="60">🇲🇾 +60</option>
              <option value="65">🇸🇬 +65</option>
              <option value="673">🇧🇳 +673</option>
              <option value="66">🇹🇭 +66</option>
              <option value="63">🇵🇭 +63</option>
              <option value="84">🇻🇳 +84</option>
              <option value="855">🇰🇭 +855</option>
              <option value="95">🇲🇲 +95</option>
              <option value="852">🇭🇰 +852</option>
              <option value="886">🇹🇼 +886</option>
              <option value="82">🇰🇷 +82</option>
              <option value="81">🇯🇵 +81</option>
              <option value="91">🇮🇳 +91</option>
              <option value="92">🇵🇰 +92</option>
              <option value="880">🇧🇩 +880</option>
              <option value="621">🇮🇩 +621</option>
              <option value="1">🇺🇸 +1</option>
              <option value="44">🇬🇧 +44</option>
              <option value="61">🇦🇺 +61</option>
              <option value="64">🇳🇿 +64</option>
              <option value="49">🇩🇪 +49</option>
              <option value="33">🇫🇷 +33</option>
              <option value="34">🇪🇸 +34</option>
              <option value="39">🇮🇹 +39</option>
              <option value="7">🇷🇺 +7</option>
              <option value="27">🇿🇦 +27</option>
              <option value="966">🇸🇦 +966</option>
              <option value="971">🇦🇪 +971</option>
            </select>
            <input type="text" id="nomor" name="nomor" placeholder="8123456789"
                   inputmode="numeric" pattern="[0-9]{6,14}" required />
          </div>
        </div>

        <!-- input password -->
        <div class="field">
          <label for="password">PASSWORD</label>
          <div class="input-shell">
            <input type="password" id="password" name="password" placeholder="Masukkan password" required />
          </div>
        </div>

        <!-- tombol masuk -->
        <button class="btn" type="submit" id="btnMasuk">Masuk</button>
        <div class="alert" id="alertBox"></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const btn = document.getElementById("btnMasuk");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.className = "alert";
      btn.disabled = true;
      btn.textContent = "Memverifikasi ke Google Spreadsheet...";

      const dial = document.getElementById("dialCode").value;
      const rawNomor = document.getElementById("nomor").value.replace(/[^0-9]/g, "");
      // gabungkan kode negara + nomor (tanpa 0 di depan)
      let nomorFull = rawNomor.startsWith("0") ? dial + rawNomor.slice(1) : dial + rawNomor;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            nomor: nomorFull
          })
        });
        const data = await res.json();
        if (data.ok) {
          alertBox.className = "alert ok";
          alertBox.textContent = "✔ " + data.message;
          setTimeout(() => (window.location.href = data.redirect || "/dashboard?menu=beranda"), 700);
        } else {
          // data tidak ada / salah di spreadsheet -> login digagalkan
          alertBox.className = "alert err";
          alertBox.textContent = "✖ " + data.message;
          btn.disabled = false;
          btn.textContent = "Masuk";
        }
      } catch (err) {
        alertBox.className = "alert err";
        alertBox.textContent = "✖ Gagal terhubung ke server: " + err.message;
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    });
  </script>
</body>
</html>
